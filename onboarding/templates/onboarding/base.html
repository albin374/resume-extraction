<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}HRMS - Onboarding{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
    .navbar { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); }
    .navbar-brand { font-weight: 700; font-size: 1.4rem; letter-spacing: 1px; }
    .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .badge-status-pending { background: #ffc107; color: #000; }
    .badge-status-shortlisted { background: #0dcaf0; color: #000; }
    .badge-status-hired { background: #198754; }
    .badge-status-rejected { background: #dc3545; }
    .badge-status-reviewed { background: #6c757d; }
    .hero-section { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 20px; }
  </style>
</head>
<body>
<nav class="navbar navbar-dark navbar-expand-lg mb-4">
  <div class="container">
    <a class="navbar-brand text-white" href="{% url 'apply_job' %}">
      <i class="bi bi-people-fill me-2"></i>HRMS Portal
    </a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link text-white" href="{% url 'apply_job' %}"><i class="bi bi-file-earmark-person me-1"></i>Apply</a>
      <a class="nav-link text-white" href="{% url 'admin_dashboard' %}"><i class="bi bi-speedometer2 me-1"></i>Admin</a>
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
      {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
